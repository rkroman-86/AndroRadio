name: Build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleDebug 2>&1 | tee build.log

      # Vérifie que la version Play (minifiée par R8) se construit, même sans clé de signature.
      - name: Check release build (R8)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain assembleRelease 2>&1 | tee -a build.log

      - name: Report build errors
        if: failure()
        run: |
          # Résumé des erreurs en annotation (lisible sans se connecter à GitHub)
          msg=$(grep -E "^e: |error:|What went wrong|^> |Could not" -A2 build.log | head -80 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Build failed::${msg}"

      - uses: actions/upload-artifact@v4
        with:
          name: androradio-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      # APK de test téléchargeable directement depuis la page Releases (tag « dev »).
      - name: Publish dev release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk AndroRadio-dev.apk
          gh release delete dev --yes --cleanup-tag || true
          gh release create dev AndroRadio-dev.apk --prerelease --target "${{ github.sha }}" \
            --title "AndroRadio dev build" \
            --notes "Build de test automatique du commit ${{ github.sha }}."

      # Build signé pour Google Play : uniquement si les secrets de signature existent.
      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDRORADIO_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          fi

      - name: Build signed release (AAB + APK)
        if: steps.keystore.outputs.path != ''
        env:
          ANDRORADIO_KEYSTORE: ${{ steps.keystore.outputs.path }}
          ANDRORADIO_KEYSTORE_PASSWORD: ${{ secrets.ANDRORADIO_KEYSTORE_PASSWORD }}
          ANDRORADIO_KEY_ALIAS: ${{ secrets.ANDRORADIO_KEY_ALIAS }}
          ANDRORADIO_KEY_PASSWORD: ${{ secrets.ANDRORADIO_KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease assembleRelease

      - uses: actions/upload-artifact@v4
        if: steps.keystore.outputs.path != ''
        with:
          name: androradio-release
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
