name: Store screenshots

# Génère les captures Google Play (stations fictives, EN/FR/RU, téléphone + tablettes)
# et les enregistre dans fastlane/metadata/android/<langue>/images/.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'app/src/main/java/com/plugyourhome/androradio/ui/**'
      - 'app/src/main/res/values*/**'
      - 'app/src/test/**'
      - '.github/workflows/screenshots.yml'

permissions:
  contents: write

jobs:
  screenshots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Render screenshots
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain recordRoborazziDebug 2>&1 | tee build.log

      - name: Report errors
        if: failure()
        run: |
          msg=$(grep -E "^e: |error:|FAILED|What went wrong|Exception|^> |Could not|at com.plugyourhome" -A2 build.log | head -100 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
          echo "::error title=Screenshots failed::${msg}"
          # Rapport des tests en échec, s'il existe
          for f in app/build/test-results/testDebugUnitTest/*.xml; do
            [ -f "$f" ] || continue
            m=$(grep -A8 "<failure" "$f" | head -40 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            [ -n "$m" ] && echo "::error title=$(basename $f)::${m}"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: store-screenshots
          path: fastlane/metadata/android/*/images/

      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fastlane/metadata/android
          if git diff --cached --quiet; then echo "Aucun changement"; exit 0; fi
          git commit -m "Captures Google Play mises à jour [skip ci]"
          git push
